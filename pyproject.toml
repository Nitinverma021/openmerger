[project]
name = "openmerger"
version = "1.1.0"
description = "A local-first Windows PDF merge utility"
requires-python = ">=3.10"
dependencies = ["pikepdf==10.8.0", "Pillow==12.2.0", "PyMuPDF==1.28.2", "python-docx==1.2.0", "openpyxl==3.1.5", "python-pptx==1.0.2"]

[project.scripts]
openmerger = "pdf_fast_merger.cli:main"
openmerger-pages = "pdf_fast_merger.operations:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
